version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: lingo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: lingo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lingo_latency
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-1:
    build: ./backend
    container_name: backend-1
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/lingo_latency
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend-2:
    build: ./backend
    container_name: backend-2
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/lingo_latency
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend-3:
    build: ./backend
    container_name: backend-3
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/lingo_latency
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: lingo-loadbalancer
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend-1
      - backend-2
      - backend-3